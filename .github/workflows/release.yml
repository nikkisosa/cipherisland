name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build installers
        run: npm run winland -- build

      - name: Collect release files
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" dist-release/
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" dist-release/
          Copy-Item "src-tauri/target/release/cipherisland.exe" "dist-release/CipherIsland_${version}_x64-portable.exe"
          Get-ChildItem dist-release | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist-release/SHA256SUMS.txt
          }
          Get-ChildItem dist-release | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CipherIsland-windows
          path: dist-release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CipherIsland ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: dist-release/*
