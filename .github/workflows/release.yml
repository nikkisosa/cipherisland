name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release
        type: boolean
        default: true
      bump:
        description: Which part of the version to raise for this release
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Work out version
        id: meta
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # A pushed tag decides its own version. A manual run takes the highest of the latest
          # v*.*.* tag and the version in tauri.conf.json, then raises it by the chosen part.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            $bumped = $false
          } else {
            $known = @([version](Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version)
            foreach ($t in (git tag --list 'v*')) {
              $n = $t.TrimStart('v')
              if ($n -match '^\d+\.\d+\.\d+$') { $known += [version]$n }
            }
            $top = $known | Sort-Object -Descending | Select-Object -First 1
            switch ($env:BUMP) {
              'major' { $next = [version]::new($top.Major + 1, 0, 0) }
              'minor' { $next = [version]::new($top.Major, $top.Minor + 1, 0) }
              default { $next = [version]::new($top.Major, $top.Minor, $top.Build + 1) }
            }
            $version = $next.ToString()
            $bumped = $true
          }

          # Write the version into every file that carries it, so the build embeds it.
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function Set-First([string]$path, [string]$pattern, [string]$replacement, [int]$count = 1) {
            $text = [IO.File]::ReadAllText($path)
            $text = [regex]::new($pattern, 'Multiline').Replace($text, $replacement, $count)
            [IO.File]::WriteAllText($path, $text, $utf8)
          }
          Set-First 'src-tauri/tauri.conf.json' '"version":\s*"[^"]+"' "`"version`": `"$version`""
          Set-First 'package.json' '"version":\s*"[^"]+"' "`"version`": `"$version`""
          Set-First 'package-lock.json' '"version":\s*"[^"]+"' "`"version`": `"$version`"" 2
          Set-First 'src-tauri/Cargo.toml' '^version\s*=\s*"[^"]+"' "version = `"$version`""

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "bumped=$bumped" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing v$version"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build installers
        run: npm run winland -- build

      - name: Collect release files
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" dist-release/
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" dist-release/
          Copy-Item "src-tauri/target/release/cipherisland.exe" "dist-release/CipherIsland_${version}_x64-portable.exe"

          $stage = "stage/CipherIsland"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "src-tauri/target/release/cipherisland.exe" "$stage/CipherIsland.exe"
          Copy-Item README.md $stage/
          Compress-Archive -Path $stage -DestinationPath "dist-release/CipherIsland_${version}_x64-portable.zip" -Force

          Get-ChildItem dist-release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content SHA256SUMS.txt
          }
          Move-Item SHA256SUMS.txt dist-release/
          Get-ChildItem dist-release | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CipherIsland-windows
          path: dist-release/*
          if-no-files-found: error

      - name: Commit version bump
        id: commit
        if: steps.meta.outputs.bumped == 'True' && inputs.publish
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "Release ${{ steps.meta.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.commit.outcome == 'success' && format('refs/heads/{0}', github.ref_name) || github.sha }}
          name: CipherIsland ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          draft: false
          files: dist-release/*
